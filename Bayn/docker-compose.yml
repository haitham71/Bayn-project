# ─────────────────────────────────────────────
# docker-compose.yml
# ─────────────────────────────────────────────
#
# Values come from the environment, not a checked-in .env file:
#   local:  export POSTGRES_USER=... POSTGRES_PASSWORD=... POSTGRES_DB=... first
#   CI:     GitHub Actions injects these from repo Secrets automatically
#
#   docker compose up -d
#   docker compose up -d --build
#   docker compose down
#   docker compose logs -f api
#
# ─────────────────────────────────────────────
services:
  postgres:
    image: postgres:15
    container_name: bayn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./backend
    container_name: bayn_api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      AUTHENTICA_API_KEY: ${AUTHENTICA_API_KEY}
      AUTHENTICA_BASE_URL: ${AUTHENTICA_BASE_URL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      CALCOM_API_KEY: ${CALCOM_API_KEY}
      CALCOM_CLIENT_ID: ${CALCOM_CLIENT_ID}
      CALCOM_CLIENT_SECRET: ${CALCOM_CLIENT_SECRET}
      CALCOM_EVENT_TYPE_ID: ${CALCOM_EVENT_TYPE_ID}
      DAILY_API_KEY: ${DAILY_API_KEY}
      DAILY_API_URL: ${DAILY_API_URL}
      DAILY_DOMAIN: ${DAILY_DOMAIN}
      # Without this the recording-ready webhook fails its signature check and
      # every recording is dropped silently — see integrations/daily.py.
      DAILY_WEBHOOK_SECRET: ${DAILY_WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      FRONTEND_URL: ${FRONTEND_URL}
      NDA_SERVICE_URL: ${NDA_SERVICE_URL}
      NDA_SERVICE_KEY: ${NDA_SERVICE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/bayn:/app/bayn
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini
    command: >
      uvicorn bayn.main:app
      --host 0.0.0.0
      --port 8000
      --reload
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: bayn_frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - api
volumes:
  postgres_data:
    name: bayn_postgres_data
